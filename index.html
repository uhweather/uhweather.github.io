<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Glass — UH Mānoa</title>
    <meta name="description" content="Live Hawai‘i conditions, GOES-West imagery, forecasts and tropical systems. A passion project by ATMO students @ UH Mānoa." />
    <meta name="theme-color" content="#1f3763" />

    <!--
      The card a link shows when it is pasted somewhere. A crawler does not run
      the app, so the build writes one of these per route from src/lib/pageMeta;
      the values here are the site-level ones and what an unknown path gets.
      __SITE__ is filled in with the deployed origin at build time.
    -->
    <link rel="canonical" href="__SITE__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weather Glass" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Weather Glass — UH Mānoa" />
    <meta property="og:description" content="Live Hawai‘i conditions, GOES-West imagery, forecasts and tropical systems. A passion project by ATMO students @ UH Mānoa." />
    <meta property="og:url" content="__SITE__" />
    <meta property="og:image" content="__SITE__og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Weather Glass — a passion project by ATMO students @ UH Mānoa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weather Glass — UH Mānoa" />
    <meta name="twitter:description" content="Live Hawai‘i conditions, GOES-West imagery, forecasts and tropical systems. A passion project by ATMO students @ UH Mānoa." />
    <meta name="twitter:image" content="__SITE__og.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.weather.gov" />
    <link rel="preconnect" href="https://cdn.star.nesdis.noaa.gov" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
